AWSTemplateFormatVersion: "2010-09-09"
Description: Canary Wharf Salon - static SPA hosting (private S3 + CloudFront with OAC)

# Optional custom domain: with all three parameters set, the site answers on the apex and www, www is the
# address everyone ends up on (other hosts get a 301), and Route 53 points both names at CloudFront.
Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: Apex domain, e.g. ngcanarywharf.co.uk. Empty for no custom domain.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate in us-east-1 covering the apex and www (infra/cert.yml).
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone for DomainName (infra/dns.yml).

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true

  # Sends the apex and the cloudfront.net address to https://www.<domain>, keeping the path and query.
  CanonicalHostFunction:
    Type: AWS::CloudFront::Function
    Condition: HasDomain
    Properties:
      Name: !Sub "${AWS::StackName}-canonical-host"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect other hosts to www
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var CANONICAL = "www.${DomainName}";
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : "";
          if (host === CANONICAL) return request;
          var query = Object.keys(request.querystring).map(function (k) {
            var q = request.querystring[k];
            var all = q.multiValue ? q.multiValue : [q];
            return all.map(function (v) { return v.value === "" ? k : k + "=" + v.value; }).join("&");
          }).join("&");
          return {
            statusCode: 301,
            statusDescription: "Moved Permanently",
            headers: { location: { value: "https://" + CANONICAL + request.uri + (query ? "?" + query : "") } },
          };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Ref AWS::StackName
        Enabled: true
        Aliases: !If [HasDomain, [!Ref DomainName, !Sub "www.${DomainName}"], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations: !If
            - HasDomain
            - - EventType: viewer-request
                FunctionARN: !GetAtt CanonicalHostFunction.FunctionMetadata.FunctionARN
            - !Ref AWS::NoValue
        CustomErrorResponses:
          # SPA fallback: unknown paths serve index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Z2FDTNDATAQYW2 is CloudFront's fixed hosted zone for alias records.
  ApexRecord:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !If [HasDomain, !Sub "https://www.${DomainName}", !Sub "https://${Distribution.DomainName}"]
